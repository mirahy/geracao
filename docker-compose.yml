services:
  app:
    build: .
    image: geracao-solar:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: "Geração Solar"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      APP_KEY: "${APP_KEY:-}"            # vazio = gera e guarda no volume
      APP_LOCALE: pt_BR
      APP_FALLBACK_LOCALE: pt_BR
      APP_TIMEZONE: America/Campo_Grande
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/database/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      # E-mail das notificações (padrão: apenas registra no log). Exemplo SMTP: MAIL_MAILER=smtp
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_SCHEME: "${MAIL_SCHEME:-}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-geracao@example.com}"
      MAIL_FROM_NAME: "Geração Solar"
      ADMIN_NAME: "${ADMIN_NAME:-Administrador}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    volumes:
      - geracao_storage:/app/storage

volumes:
  geracao_storage:
