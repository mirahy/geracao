services:
  app:
    build: .
    image: geracao-solar:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: "Geração Solar"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      APP_KEY: "${APP_KEY:-}"            # vazio = gera e guarda no volume
      APP_LOCALE: pt_BR
      APP_FALLBACK_LOCALE: pt_BR
      APP_TIMEZONE: America/Campo_Grande
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/database/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      ADMIN_NAME: "${ADMIN_NAME:-Administrador}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    volumes:
      - geracao_storage:/app/storage

volumes:
  geracao_storage:
